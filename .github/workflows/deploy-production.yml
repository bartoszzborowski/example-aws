name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: stream-my-sport
  ASG_NAME: stream-my-sport-prod-app-asg
  DEPLOY_ROLE: arn:aws:iam::ACCOUNT_ID:role/stream-my-sport-prod-github-deploy

jobs:
  # -------------------------------------------------------
  # 1. Build Docker image and push to ECR
  # -------------------------------------------------------
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    if: github.ref_name == 'production'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        name: Set image tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"

  # -------------------------------------------------------
  # 2. Run DB migrations on a running instance via SSM
  # -------------------------------------------------------
  migrate:
    name: Run migrations
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pick a running instance from the ASG
        id: instance
        run: |
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId | [0]' \
            --output text)
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected instance: $INSTANCE_ID"

      - name: Run artisan migrate via SSM RunCommand
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker exec $(docker ps -q --filter label=com.docker.compose.service=app) php artisan migrate --force"]' \
            --output text \
            --query "Command.CommandId")
          echo "SSM Command ID: $COMMAND_ID"

          # Poll until the command finishes (max ~5 min)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.instance.outputs.id }}" \
              --query 'Status' --output text)
            echo "[$i] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.instance.outputs.id }}" \
                --query '{Out:StandardOutputContent,Err:StandardErrorContent}' \
                --output json
              exit 1
            fi
            sleep 10
          done

  # -------------------------------------------------------
  # 3. Rolling instance refresh (deploys new :latest image)
  # -------------------------------------------------------
  deploy:
    name: Rolling deploy
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ env.ASG_NAME }}" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}'

      - name: Wait for refresh to complete
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ env.ASG_NAME }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "[$i] Refresh status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 30
          done
          echo "Timed out waiting for refresh"
          exit 1

      - name: Notify success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "Deploy produkcyjny stream-my-sport (${{ github.sha }}) zakończony sukcesem!"

      - name: Notify failure
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "Deploy produkcyjny stream-my-sport (${{ github.sha }}) zakończył się błędem!"
