name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: stream-my-sport
  ASG_NAME: stream-my-sport-prod-app-asg
  DEPLOY_ROLE: arn:aws:iam::881571523152:role/stream-my-sport-prod-github-deploy

jobs:
  # -------------------------------------------------------
  # 1. Build Docker image and push to ECR
  # -------------------------------------------------------
  build-and-push:
    name: Build & push
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner — no QEMU, 5-10x faster than cross-compile
    if: github.ref_name == 'production'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        name: Set image tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build \
            --cache-from "$IMAGE:latest" \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"

  # -------------------------------------------------------
  # 2. Validate migrations against a fresh MySQL — before touching AWS
  # -------------------------------------------------------
  validate-migration:
    name: Validate migration
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run migration against test DB
        run: |
          docker run --rm \
            --network host \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e APP_ENV=testing \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=migration_test \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=password \
            "${{ needs.build-and-push.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}" \
            php artisan migrate --force

  # -------------------------------------------------------
  # 3. Rolling instance refresh (deploys new :latest image)
  # -------------------------------------------------------
  deploy:
    name: Rolling deploy
    needs: validate-migration
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ env.ASG_NAME }}" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":60}'

      - name: Wait for refresh to complete
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ env.ASG_NAME }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "[$i] Refresh status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 30
          done
          echo "Timed out waiting for refresh"
          exit 1

